<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Консультант приёмной комиссии — РТУ МИРЭА</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f4f5f7;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  #chatContainer {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    height: 90vh;
  }
  #chatHeader {
    padding: 16px 20px;
    background: #1a3c8a;
    color: white;
    border-radius: 12px 12px 0 0;
    font-weight: 600;
  }
  #chatHeader .subtitle {
    font-weight: 400;
    font-size: 13px;
    opacity: 0.85;
    margin-top: 2px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .message.user {
    align-self: flex-end;
    background: #1a3c8a;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.bot {
    align-self: flex-start;
    background: #eef0f4;
    color: #222;
    border-bottom-left-radius: 4px;
  }
  .message.loading {
    align-self: flex-start;
    background: #eef0f4;
    color: #888;
    font-style: italic;
  }
  #inputArea {
    display: flex;
    padding: 16px;
    border-top: 1px solid #eee;
    gap: 8px;
  }
  #messageInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    resize: none;
  }
  #sendBtn {
    padding: 0 20px;
    background: #1a3c8a;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #sendBtn:disabled {
    background: #aab;
    cursor: default;
  }
  #disclaimer {
    text-align: center;
    font-size: 11px;
    color: #999;
    padding: 10px 16px;
    border-top: 1px solid #eee;
  }
</style>
</head>
<body>

<div id="chatContainer">
  <div id="chatHeader">
    Консультант приёмной комиссии
    <div class="subtitle">РТУ МИРЭА · отвечает на основе официальных документов</div>
  </div>
  <div id="messages"></div>
  <div id="inputArea">
    <textarea id="messageInput" rows="1" placeholder="Задайте вопрос о поступлении..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">Отправить</button>
  </div>
  <div id="disclaimer">
    Ответы формируются автоматически и могут содержать неточности. Для получения точной информации обращайтесь в приёмную комиссию РТУ МИРЭА напрямую.
  </div>
</div>

<script>
let sessionId = localStorage.getItem('chatSessionId');
if (!sessionId) {
  sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  localStorage.setItem('chatSessionId', sessionId);
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

addMessage('bot', 'Здравствуйте! Я консультант приёмной комиссии РТУ МИРЭА. Спросите меня о поступлении, льготах, общежитиях, вступительных испытаниях и других вопросах.');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;

  const loadingEl = addMessage('loading', 'Печатает...');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: text })
    });
    const data = await res.json();
    loadingEl.remove();

    if (data.answer) {
      addMessage('bot', data.answer);
    } else {
      addMessage('bot', 'Произошла ошибка: ' + (data.error || 'неизвестная ошибка'));
    }
  } catch (err) {
    loadingEl.remove();
    addMessage('bot', 'Не удалось связаться с сервером. Попробуйте ещё раз.');
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
